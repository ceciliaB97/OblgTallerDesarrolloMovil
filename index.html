<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="js/jquery-3.6.0.min.js"></script>
    <script src="js/functions.js"></script>
    <link rel="stylesheet" href="css/styles.css">
    <!-- Archivos de Onsen UI - 2 css y 1 js -->
    <link rel="stylesheet" href="OnsenUI-dist-2.11.2/css/onsenui.min.css">
    <link rel="stylesheet" href="OnsenUI-dist-2.11.2/css/old-onsen-css-components.min.css">
    <script src="OnsenUI-dist-2.11.2/js/onsenui.min.js"></script>
</head>

<body>
    <ons-navigator page="temp_login" id="nav"></ons-navigator>
    <template id="temp_login">
        <ons-page id="pag_login">
            <section>
                <h1>Login</h1>
                <p><input type="text" id="login_usuario" placeholder="Usuario" class="text-input text-input--material">
                </p>
                <p><input type="password" id="login_password" placeholder="Contrase&ntilde;a"
                        class="text-input text-input--material"></p>
                <ons-button id="login_btn">Login</ons-button>
                <ons-button id="login_register_btn" modifier="outline">Register</ons-button>
            </section>
        </ons-page>
    </template>

    <template id="temp_registro">
        <ons-page id="pag_registro">
            <section>
                <!-- Registro de usuario: nombre, apellido, email, password, password 2 -->
                <h1>Registro de usuario</h1>
                <p>Nombre</p>
                <p><input type="text" id="registro_nombre" placeholder="Usuario"
                        class="text-input text-input--material">
                </p>
                <p>Apellido</p>
                <p><input type="text" id="registro_apellido" placeholder="Usuario"
                        class="text-input text-input--material">
                </p>
                <p>Email</p>
                <p><input type="text" id="registro_email" placeholder="Usuario" class="text-input text-input--material">
                </p>
                <p>Direcci&oacute;n</p>
                <p><input type="text" id="registro_direccion" placeholder="Direcci&oacute;n"
                        class="text-input text-input--material">
                </p>
                <p>Contrase&ntilde;a</p>
                <p><input type="password" id="registro_password" placeholder="Contrase&ntilde;a"
                        class="text-input text-input--material"></p>
                <p>Re contrase&ntilde;a</p>
                <p><input type="password" id="registro_password_repeat" placeholder="Contrase&ntilde;a"
                        class="text-input text-input--material"></p>
                <ons-button id="registrarse_btn">Registrarse</ons-button>
            </section>
        </ons-page>
    </template>

    <template id="temp_pantalla_principal">
        <ons-page id="pag_pantalla_principal">
            <h1>Bienvenido/a</h1>
            <!--Agregar un side menu / tabs-->
            <ons-button id="btn_pantalla_principal_productos">Productos</ons-button>
            <ons-button id="btn_pantalla_principal_favoritos">Favoritos</ons-button>
            <ons-button id="btn_pantalla_principal_mis_pedidos">Mis Pedidos</ons-button>
        </ons-page>
    </template>

    <template id="temp_pantalla_productos">
        <ons-page id="pag_pantalla_productos">
            <script>
                ons.getScriptPage().onInit = function() {
                    //Se ejecuta una unica vez => Cuando se carga la pagina.

                }
                ons.getScriptPage().onShow = function() {
                    //Se ejecuta siempre = > Cuando se muestra se la pagina.

                    //ESTO ES LO QUE TENEMOS QUE REVISAR - 
                    let usuario = sessionStorage.getItem("usuario");
                    usuario = JSON.parse(usuario);
                    $("#saludo").html(`Hola <strong>${usuario.email}</strong>`);
                    $("#l_lista_productos").empty();
                    //  $("#saludo").html(`Hola <strong>${usuario.email}</strong>`);
                    // https://onsen.io/v2/api/css.html#list-category
                    // http://images.marcelocaiafa.com/producto/1.jpg
                    $("#spn_txtemp_loading").text("Cargando productos...");
                    $("#cargando").show();

                    //ajax setup 
                    $.ajaxSetup({
                        headers: {
                            "Content-Type": "application/json"
                        }
                    });
                    $.ajax({
                        url: "http://api.marcelocaiafa.com/producto",
                        type: "GET",
                        dataType: "json",
                        success: function (respuesta) {
                            let item = "";
                            let url = "";
                            $.each(respuesta.descripcion, function (pos, producto) {
                                url = `http://images.marcelocaiafa.com/producto/${producto.foto}`;
                                item = `<ons-list-item modifier="chevron longdivider" tappable tap-background-color="#A6FF33" data-id="${producto.id}" class="listado_productos">
                                        <div class="left">
                                            <img class="list-item__thumbnail" src="${url}">
                                        </div>
                                        <div class="center">
                                            <span class="list-item__title">${producto.nombre}</span><span class="list-item__subtitle">${producto.precio}</span>
                                            <span class="list-item">${producto.etiqueta}></span><span class="list-item">${producto.estado}</span>
                                        </div>
                                        </ons-list-item>`; // Falta agregar ícono de FAVORITO a los productos
                                $("#l_lista_productos").append(item);
                            });
                        },
                        error: function (xml, err, status) {
                            ons.notification.toast(xml.responseJSON.descripcion, { "timeout": 3000 });
                        },
                        complete: function() {
                            $("#cargando").hide();
                        }
                    });
                }
            </script>
            <section>
                <h1>Listado de productos</h1>
                <p id="saludo"></p>
                <!-- <ul class="list" id="l_lista_productos"></ul> -->
                <ons-list id="l_lista_productos"></ons-list>
            </section>
        </ons-page>
    </template>

    <template id="temp_listado_productos">
        <ons-page id="pag_listado_productos">
            <!--ACÁ VAN LOS PRODUCTOS-->
            <!--Cada producto tiene NOMBRE, PRECIO, FOTO, CÓDIGO, ETIQUETAS, ESTADO-->
            <p><input type="text" class="text-input text-input--material" placeholder="Filtrar productos..."></p>

            <script>
                ons.getScriptPage().onShow = function() {
                    let usuario = sessionStorage.getItem("usuario");
                    usuario = JSON.parse(usuario);
                    $("#saludo").html(`Hola <strong>${usuario.email}</strong>`);

                    $("#spn_txtemp_cargando").text('Cargando producto...');
                    $("#cargando").show();

                    $.ajax({
                        url: `https://ort-tallermoviles.herokuapp.com/api/productos`,
                        type: "GET",
                        dataType: "json",
                        success: function (respuesta) {
                            let item_producto = "";
                            $.each(respuesta.descripcion, function (pos, producto_item) {
                                item = `
                                <ons-list-item modifier="chevron longdivider" tappable tap-background-color="#4FFF33" class="listado_productos_listado_class" data-id="${producto_item._id}" data-codigo="${producto_item.codigo}">
                                    <div class="list-item__left">
                                    <img class="list-item__thumbnail" src="https://ort-tallermoviles.herokuapp.com/api/productos/${producto_item.urlImagen}" alt="producto ${producto_item.nombre}">
                                    </div>

                                    <div class="list-item__center">
                                    <div class="list-item__title">${producto_item.nombre}</div>
                                    <div class="list-item__subtitle">${producto_item.precio}t</div>
                                    <div class="list-item__subtitle">${producto_item.estado}t</div>
                                    </div>
                                </ons-list-item>
                                `;
                                $("#listado_productos_ul_listado").append(item);
                            });
                        },
                        error: function (xml, error, status) {
                            ons.notification.toast(xml.responseJSON.description, { timeout: 4000 });
                        },
                        complete: function() {
                            $("#cargando").hide();
                        }
                    });

                    $(document).on("click", "#listado_productos_listado_class", function() {
                        alert($(this).data("id"));
                    });
                }
            </script>
            <section>
                <h1>productos</h1>
                <p id="saludo"></p>
                <ons-list id="listado_productos_ul_listado" class="list">
                </ons-list>
            </section>
        </ons-page>
    </template>

    <template id="temp_info_producto">
        <ons-page id="pag_info_producto">
            <script>
                ons.getScriptPage().onShow = function() {
                    let id_producto = this.data.id;
                    //https://ort-tallermoviles.herokuapp.com/api/productos/1

                    $("#spn_txt_cargando").text('Cargando local...');
                    $("#cargando").show();
                    $.ajax({
                        url: `https://ort-tallermoviles.herokuapp.com/api/productos/${id_producto}`,
                        type: "GET",
                        dataType: "json",
                        //headers: {
                        //    "token": respuesta.token
                        //},
                        success: function (producto_info) {
                            let url_local_img = `http://images.marcelocaiafa.com/local/${producto_info.imagen}`;
                            $("#producto_info_img").attr("src", url_local_img);
                            $("#producto_info_nombre").text(producto_info.nombre);
                            $("#producto_info_descripcion").text(producto_info.descripcion);
                            //https://onsen.io/v2/api/js/ons-icon.html
                            $("#producto_info_span_direccion").html(`<ons-icon icon="fa-map-marked"></ons-icon> ${producto_info.direccion}`);
                            $("#producto_info_span_telefono").html(`<ons-icon icon="fa-phone"></ons-icon> ${producto_info.telefono}`);
                            $("#producto_info_span_horario").html(`<ons-icon icon="fa-clock"></ons-icon> ${producto_info.horarios}`);
                            //mapa
                            var map = L.map('producto_info_map').setView([producto_info.coord.lat, producto_info.coord.lng], 15);

                            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                                attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
                            }).addTo(map);

                            L.marker([producto_info.coord.lat, producto_info.coord.lng]).addTo(map)
                                .bindPopup(`<strong>${producto_info.nombre}</strong><br>${producto_info.direccion}`);

                            //let nav = document.getElementById("nav");
                            // nav.pushPage("temp_locales");
                            // nav.options = { animation: "lisft", animationOptions: { duration: 2 } };
                            //ons.notification.toast("Logueado corretamente", { timeout: 2000 });
                        },
                        error: function (xml, error, status) {
                            ons.notification.toast(xml.responseJSON.description, { timeout: 4000 });
                        },
                        complete: function() {
                            $("#cargando").hide();
                        }
                    });
                }
            </script>
            <section>
                <h1>Info Local</h1>
                <article id="producto_info_article">
                    <ons-card>
                        <img src="" id="producto_info_img" alt="Onsen UI" style="width: 100%">
                        <div class="title">
                            <span id="producto_info_nombre"></span>
                        </div>
                        <div class="content">
                            <p id="producto_info_descripcion"></p>

                            <ons-list>
                                <ons-list-header><span id="producto_info_span_direccion"></span></ons-list-header>
                                <ons-list-item><span id="producto_info_span_telefono"></span></ons-list-item>
                                <ons-list-item><span id="producto_info_span_horario"></span></ons-list-item>
                            </ons-list>
                            <div id="producto_info_map"></div>
                        </div>
                        </div>
                    </ons-card>
                </article>
            </section>
        </ons-page>
    </template>


</body>

</html>
